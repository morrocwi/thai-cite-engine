[project]
name = "thaicite"
version = "0.1.0"
description = "ThaiCite -- v0.1 concept-validation prototype (hallucination-firewall core)"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "pythainlp>=5.0",
]

[project.scripts]
thaicite = "thaicite.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
